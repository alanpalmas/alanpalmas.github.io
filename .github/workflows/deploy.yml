name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static assets
        run: |
          cp -r img dist/img
          cp cv.html dist/cv.html
          cp cv-es.html dist/cv-es.html
          cp -r pdf dist/pdf
          touch dist/.nojekyll

      - name: Verify critical assets
        run: |
          test -d dist/img        || (echo "ERROR: dist/img missing" && exit 1)
          test -f dist/cv.html    || (echo "ERROR: dist/cv.html missing" && exit 1)
          test -f dist/cv-es.html || (echo "ERROR: dist/cv-es.html missing" && exit 1)
          test -d dist/pdf        || (echo "ERROR: dist/pdf missing" && exit 1)
          test -f dist/assets/index*.js  || (echo "ERROR: dist/assets JS missing" && exit 1)
          test -f dist/assets/index*.css || (echo "ERROR: dist/assets CSS missing" && exit 1)
          echo "All critical assets present."

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
