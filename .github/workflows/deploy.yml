name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static assets
        run: |
          cp -r img dist/img
          cp cv.html dist/cv.html
          cp cv-es.html dist/cv-es.html
          cp -r pdf dist/pdf

      - name: Verify critical assets
        run: |
          test -d dist/img  || (echo "ERROR: dist/img missing" && exit 1)
          test -f dist/cv.html || (echo "ERROR: dist/cv.html missing" && exit 1)
          test -f dist/cv-es.html || (echo "ERROR: dist/cv-es.html missing" && exit 1)
          test -d dist/pdf  || (echo "ERROR: dist/pdf missing" && exit 1)
          echo "All critical assets present."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
